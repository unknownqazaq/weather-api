version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sqlx-users-postgres
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api-service/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./api-service/sql/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: weather-api-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      APP_PORT: 8080
      GATEWAY_URL: http://gateway-service:8081
      JWT_SECRET: dev-secret-key-change-me
    depends_on:
      postgres:
        condition: service_healthy

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: weather-gateway-service
    ports:
      - "8081:8081"
    environment:
      APP_PORT: 8081
      API_SERVICE_URL: http://api-service:8080
    depends_on:
      - api-service

volumes:
  postgres_data:
